{% extends 'base.html' %}
{% block content %}
	<h1>Login</h1>
	<form method="post" class="form-card">
		<label>
			<span>Username</span>
			<input type="text" name="username" required />
		</label>
		<label>
			<span>Password</span>
			<input type="password" name="password" required />
		</label>
		<button type="submit" class="button">Log in</button>
		<p class="muted">No account? <a href="{{ url_for('signup') }}">Sign up</a></p>
	</form>
{% endblock %}
